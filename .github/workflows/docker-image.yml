# Build every image in this repo (one per subdirectory containing a
# Dockerfile) multi-arch (linux/amd64 + linux/arm64) and push it to the izmno
# registry, tagged with the git short commit hash plus `latest`.
#
# Each image builds on its own runner via the matrix below, so they build in
# parallel. Published as docker.izmno.be/dockerfiles/<image>:<short-sha> and
# :latest.
name: docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - php-bakkersweb
          - php-stimulans
          - weasyprint
          - gh-ost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 runner cross-build the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: docker.izmno.be
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.izmno.be/dockerfiles/${{ matrix.image }}:${{ steps.sha.outputs.short }}
            docker.izmno.be/dockerfiles/${{ matrix.image }}:latest
